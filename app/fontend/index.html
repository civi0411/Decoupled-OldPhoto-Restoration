<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Learning Demo - Image Restoration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <div class="container mt-4 mb-5" style="max-width: 1200px;">
        <div class="text-center text-white mb-4 header-title">
            <h1 class="fw-bold">AI Image Restoration</h1>
            <p class="text-muted">Deep Learning Model Demo</p>
        </div>

        <div class="card-glass p-2">
            <div class="workspace-container" id="workspace">

                <img id="imgBase" class="img-full d-none" src="" alt="Base Image">

                <div class="img-after-wrapper d-none" id="afterWrapper">
                    <img id="imgRestored" class="img-full" src="" alt="Restored Image">
                </div>

                <canvas id="particleCanvas"></canvas>

                <div id="uploadUI"
                    class="overlay-ui d-flex flex-column justify-content-center align-items-center cursor-pointer">
                    <h2 class="text-white fw-bold tracking-wide">TẢI ẢNH LÊN</h2>
                    <p class="text-secondary">Click hoặc kéo thả ảnh vào khung</p>
                </div>

                <button id="btnStart" class="btn-start d-none">START</button>

                <input type="range" min="0" max="100" value="50" class="slider d-none" id="slider">
                <div class="slider-button d-none" id="sliderButton">
                    <div class="slider-line"></div>
                    <div class="slider-arrow">↔</div>
                </div>

                <input type="file" id="imageUpload" accept="image/*" hidden>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
