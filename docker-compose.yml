services:
  old-photo-restoration:
    build: .
    ports:
      - "7860:7860"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src:/app
    volumes:
      - ./configs/external_paths.yaml:/app/configs/external_paths.yaml:ro
      - ./checkpoints:/app/checkpoints:ro
      - ./examples/outputs:/app/examples/outputs
      # Optional external models mount:
      # - /path/to/external_models:/external_models:ro
    command: python scripts/run_gradio_demo.py --server-name 0.0.0.0 --server-port 7860
    # GPU runtime / nvidia-container-toolkit là optional ở skeleton này.
